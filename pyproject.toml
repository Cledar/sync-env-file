[project]
name = "sync-env-file"
version = "0.1.0"
description = "Generate local .env from chezmoi templates and Azure Key Vault"
authors = [{ name = "Cledar" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12.7"
readme = "README.md"
dependencies = []

[project.scripts]
sync-env-file = "sync_env_file.cli:main"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "coverage>=7.6.0",
    "ruff>=0.14.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sync_env_file"]

[tool.hatch.build.targets.sdist]
exclude = [
    "examples",
    "tests",
]

[tool.ruff]
line-length = 88
extend-exclude = ["tests/**", "examples/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "DOC"]
preview = true
ignore = ["D203", "D213", "D103"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = false
build_command = "uv build"
tag_format = "v{version}"
major_on_zero = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "build", "ci", "refactor", "style", "test", "docs"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "build", "ci", "refactor", "style", "test"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.other]
match = ".*"
prerelease_token = "rc"
prerelease = true

[tool.coverage.run]
source = ["sync_env_file"]
